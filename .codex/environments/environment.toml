# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "MyBikeLab"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

worktree="${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is not defined}"

cd "${worktree}"
graphify update "${worktree}"

cd "${worktree}/frontend"
npm install'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$worktree = $env:CODEX_WORKTREE_PATH

if ([string]::IsNullOrWhiteSpace($worktree)) {
    throw "CODEX_WORKTREE_PATH is not defined"
}

Set-Location -LiteralPath $worktree

& graphify update $worktree
if ($LASTEXITCODE -ne 0) {
    throw "Graphify update failed with exit code $LASTEXITCODE"
}

Set-Location -LiteralPath (Join-Path $worktree "frontend")

& npm.cmd install
if ($LASTEXITCODE -ne 0) {
    throw "npm install failed with exit code $LASTEXITCODE"
}'''

[[actions]]
name = "Run Dev"
icon = "run"
command = '''
cd frontend
npm run dev'''
