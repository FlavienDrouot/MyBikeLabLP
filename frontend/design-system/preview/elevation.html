<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .item { background: var(--paper-0); padding: 16px; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; }
  .item.hairline { border: 1px solid var(--ink-4); }
  .item.keyline { box-shadow: var(--shadow-keyline); }
  .item.menu { box-shadow: var(--shadow-menu); }
  .item.none { border: 1px dashed var(--ink-3); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--ink-11); font-weight: 600; }
  .desc { font-family: var(--font-sans); font-size: 9px; color: var(--ink-7); margin-top: 4px; line-height: 1.4; }
  .heading { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 12px 0; }
</style></head>
<body>
  <div class="heading">Elevation · hairlines, not shadows</div>
  <div class="grid">
    <div class="item none">
      <div></div>
      <div><div class="name">shadow-none</div><div class="desc">Default. Body, hero, type-only sections.</div></div>
    </div>
    <div class="item hairline">
      <div></div>
      <div><div class="name">shadow-hairline</div><div class="desc">1px ink-4 inset. Cards, panels, tables.</div></div>
    </div>
    <div class="item keyline">
      <div></div>
      <div><div class="name">shadow-keyline</div><div class="desc">Strong 1px ink-10 underline. Headers.</div></div>
    </div>
    <div class="item menu">
      <div></div>
      <div><div class="name">shadow-menu</div><div class="desc">Floating menus, dropdowns. Sparingly.</div></div>
    </div>
  </div>
</body></html>
