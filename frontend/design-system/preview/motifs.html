<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 22px 28px; }
  .heading { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 14px 0; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); letter-spacing: 0.06em; }

  .grid-bg {
    width: 220px; height: 100px;
    background-image:
      linear-gradient(to right, var(--ink-2) 1px, transparent 1px),
      linear-gradient(to bottom, var(--ink-2) 1px, transparent 1px);
    background-size: 16px 16px;
    border: 1px solid var(--ink-4);
  }
  .ticker {
    width: 220px;
    padding: 8px 12px;
    background: var(--paper-2);
    border-top: 1px solid var(--ink-10);
    border-bottom: 1px solid var(--ink-10);
    font-family: var(--font-mono); font-size: 11px;
    color: var(--ink-11); letter-spacing: 0;
    display: flex; gap: 18px;
  }
  .ticker .up { color: var(--signal-up); }
  .ticker .down { color: var(--signal-down); }

  .crosshair {
    width: 180px; height: 90px;
    position: relative;
    border: 1px solid var(--ink-10);
    background: var(--paper-0);
  }
  .crosshair::before, .crosshair::after {
    content: ''; position: absolute; background: var(--ink-10);
  }
  .crosshair::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
  .crosshair::after { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }
  .crosshair .mark {
    position: absolute; font-family: var(--font-mono); font-size: 9px;
    color: var(--ink-7); padding: 2px 4px; background: var(--paper-0);
  }
  .crosshair .mark.tl { top: 3px; left: 3px; }
  .crosshair .mark.br { bottom: 3px; right: 3px; }
</style></head>
<body>
  <div class="heading">Visual motifs · grid, ticker, crosshair</div>
  <div class="row">
    <div class="demo">
      <div class="label">SCHEMATIC GRID · backgrounds</div>
      <div class="grid-bg"></div>
    </div>
    <div class="demo">
      <div class="label">TICKER · data band</div>
      <div class="ticker">
        <span>15 indexed</span>
        <span class="up">↓ 1,225 g</span>
        <span class="down">↑ €2,800</span>
      </div>
    </div>
    <div class="demo">
      <div class="label">CROSSHAIR · datum frame</div>
      <div class="crosshair">
        <span class="mark tl">x: 700C</span>
        <span class="mark br">y: 33 mm</span>
      </div>
    </div>
  </div>
</body></html>
