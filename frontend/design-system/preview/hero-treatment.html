<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-0); }
  body { padding: 30px 36px; }
  .eyebrow { font-family: var(--font-sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-7); }
  .title { font-family: var(--font-sans); font-weight: 800; font-size: 60px; line-height: 0.92; letter-spacing: -0.045em; color: var(--ink-12); margin-top: 14px; max-width: 560px; }
  .title em { font-style: italic; font-weight: 300; letter-spacing: -0.04em; color: var(--brass-8); }
  .lead { font-family: var(--font-sans); font-size: 15px; color: var(--ink-8); line-height: 1.55; max-width: 46ch; margin-top: 20px; }
  .cta { display: flex; gap: 12px; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; padding: 11px 18px; border-radius: 2px; }
  .btn-primary { background: var(--brass-7); color: var(--ink-12); border: 1px solid var(--brass-8); }
  .btn-secondary { background: transparent; color: var(--ink-11); border: 1px solid var(--ink-10); }
  .arr { font-family: var(--font-mono); }
</style></head>
<body>
  <div class="eyebrow">Compare road wheels</div>
  <div class="title">Wheels, <em>measured.</em><br>Not marketed.</div>
  <div class="lead">Filter 15 road wheels across 13 specification axes. See the cheapest known retailer for each model, without sifting through PDFs.</div>
  <div class="cta">
    <span class="btn btn-primary">Open comparator <span class="arr">&rarr;</span></span>
    <span class="btn btn-secondary">See the roadmap</span>
  </div>
</body></html>
