<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 24px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--ink-11); width: 20px; }
  .name { font-family: var(--font-mono); font-size: 9px; color: var(--ink-11); font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); }
  .heading { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 14px 0; }
</style></head>
<body>
  <div class="heading">Spacing scale · 4px base</div>
  <div class="row">
    <div class="item"><div class="bar" style="height: 4px"></div><div class="name">1</div><div class="px">4</div></div>
    <div class="item"><div class="bar" style="height: 8px"></div><div class="name">2</div><div class="px">8</div></div>
    <div class="item"><div class="bar" style="height: 12px"></div><div class="name">3</div><div class="px">12</div></div>
    <div class="item"><div class="bar" style="height: 16px"></div><div class="name">4</div><div class="px">16</div></div>
    <div class="item"><div class="bar" style="height: 20px"></div><div class="name">5</div><div class="px">20</div></div>
    <div class="item"><div class="bar" style="height: 24px"></div><div class="name">6</div><div class="px">24</div></div>
    <div class="item"><div class="bar" style="height: 32px"></div><div class="name">8</div><div class="px">32</div></div>
    <div class="item"><div class="bar" style="height: 40px"></div><div class="name">10</div><div class="px">40</div></div>
    <div class="item"><div class="bar" style="height: 48px"></div><div class="name">12</div><div class="px">48</div></div>
    <div class="item"><div class="bar" style="height: 64px"></div><div class="name">16</div><div class="px">64</div></div>
    <div class="item"><div class="bar" style="height: 80px"></div><div class="name">20</div><div class="px">80</div></div>
  </div>
</body></html>
