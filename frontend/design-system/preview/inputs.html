<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 24px; align-items: center; margin-bottom: 14px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); }
  .input {
    width: 100%;
    font-family: var(--font-sans); font-size: 13px;
    background: var(--paper-0);
    border: 1px solid var(--ink-4);
    border-radius: 2px;
    padding: 8px 12px;
    color: var(--ink-11);
  }
  .input:focus { outline: none; border-color: var(--ink-11); }
  .input.focused { border-color: var(--ink-11); box-shadow: inset 0 0 0 1px var(--ink-11); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); }
  .num-pair { display: flex; align-items: center; gap: 0; border: 1px solid var(--ink-4); background: var(--paper-0); border-radius: 2px; }
  .num-pair input { border: 0; background: transparent; padding: 8px 10px; width: 72px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-11); text-align: right; }
  .num-pair .sep { font-family: var(--font-mono); font-size: 12px; color: var(--ink-6); padding: 0 6px; }
  .num-pair .unit { font-family: var(--font-mono); font-size: 10px; color: var(--ink-7); padding-right: 10px; }

  .check { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-size: 12px; color: var(--ink-10); }
  .check .box { width: 14px; height: 14px; border: 1px solid var(--ink-9); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; background: var(--paper-0); }
  .check .box.checked { background: var(--ink-11); border-color: var(--ink-11); color: var(--paper-1); }
  .check .box.checked::after { content: ''; width: 6px; height: 3px; border-left: 1.5px solid var(--paper-1); border-bottom: 1.5px solid var(--paper-1); transform: rotate(-45deg) translate(1px, -1px); }
</style></head>
<body>
  <div class="row">
    <div class="label">TEXT · default</div>
    <input class="input" placeholder="Search wheels by model…">
  </div>
  <div class="row">
    <div class="label">TEXT · focus</div>
    <input class="input focused" value="DT Swiss">
  </div>
  <div class="row">
    <div class="label">RANGE · numeric pair</div>
    <div class="num-pair">
      <input value="1200"><span class="sep">-</span><input value="1620"><span class="unit">g</span>
    </div>
  </div>
  <div class="row">
    <div class="label">CHECKBOX</div>
    <div style="display:flex; gap:18px;">
      <label class="check"><span class="box checked"></span> Hookless</label>
      <label class="check"><span class="box"></span> Carbon</label>
      <label class="check"><span class="box"></span> Tubeless-ready</label>
    </div>
  </div>
</body></html>
