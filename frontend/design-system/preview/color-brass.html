<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 18px 24px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 0.7; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; }
  .swatch .name { font-family: var(--font-mono); font-size: 8px; font-weight: 500; }
  .swatch .hex { font-family: var(--font-mono); font-size: 8px; opacity: 0.75; margin-top: 1px; }
  .row-label { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 8px 0; }
  .row { margin-bottom: 14px; }
</style></head>
<body>
  <div class="row">
    <div class="row-label">Brass · premium accent (12 → 1)</div>
    <div class="grid">
      <div class="swatch" style="background:var(--brass-12); color:#f6f4ef"><div class="name">12</div><div class="hex">#2a2014</div></div>
      <div class="swatch" style="background:var(--brass-11); color:#f6f4ef"><div class="name">11</div><div class="hex">#4a3a1f</div></div>
      <div class="swatch" style="background:var(--brass-10); color:#f6f4ef"><div class="name">10</div><div class="hex">#6b5328</div></div>
      <div class="swatch" style="background:var(--brass-9); color:#f6f4ef"><div class="name">9</div><div class="hex">#8c6e35</div></div>
      <div class="swatch" style="background:var(--brass-8); color:#f6f4ef"><div class="name">8</div><div class="hex">#a88846</div></div>
      <div class="swatch" style="background:var(--brass-7); color:#1a1a17"><div class="name">7</div><div class="hex">#c9a86a</div></div>
      <div class="swatch" style="background:var(--brass-6); color:#1a1a17"><div class="name">6</div><div class="hex">#d6bb87</div></div>
      <div class="swatch" style="background:var(--brass-5); color:#1a1a17"><div class="name">5</div><div class="hex">#e2cea4</div></div>
      <div class="swatch" style="background:var(--brass-4); color:#1a1a17"><div class="name">4</div><div class="hex">#ecdec2</div></div>
      <div class="swatch" style="background:var(--brass-3); color:#1a1a17"><div class="name">3</div><div class="hex">#f3ead8</div></div>
      <div class="swatch" style="background:var(--brass-2); color:#1a1a17"><div class="name">2</div><div class="hex">#f8f1e4</div></div>
      <div class="swatch" style="background:var(--brass-1); color:#1a1a17"><div class="name">1</div><div class="hex">#fcf8ef</div></div>
    </div>
  </div>
</body></html>
