<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 28px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--ink-3); }
  .spec:last-child { border-bottom: none; }
  .meta { width: 130px; flex-shrink: 0; }
  .meta .token { font-family: var(--font-mono); font-size: 10px; color: var(--ink-11); font-weight: 600; }
  .meta .size { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); margin-top: 2px; }
  .sample { color: var(--ink-12); }
</style></head>
<body>
  <div class="spec">
    <div class="meta"><div class="token">t-display-1</div><div class="size">Inter 800 · 64/0.9 · -0.045em</div></div>
    <div class="sample t-display-1" style="font-size: 56px;">Wheels, measured.</div>
  </div>
  <div class="spec">
    <div class="meta"><div class="token">t-display-2</div><div class="size">Inter 700 · 44/0.94 · -0.035em</div></div>
    <div class="sample t-display-2" style="font-size: 40px;">Bike component intelligence</div>
  </div>
  <div class="spec">
    <div class="meta"><div class="token">t-display-light</div><div class="size">Inter 300 · 44/0.96 · -0.04em</div></div>
    <div class="sample t-display-light" style="font-size: 40px;">Precision, not preference</div>
  </div>
</body></html>
