<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 28px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); }
  .inter { font-family: var(--font-sans); font-size: 56px; line-height: 0.95; letter-spacing: -0.04em; color: var(--ink-12); }
  .mono { font-family: var(--font-mono); font-size: 44px; line-height: 1; letter-spacing: -0.01em; color: var(--ink-12); }
  .weights { display: flex; gap: 14px; align-items: baseline; font-family: var(--font-sans); color: var(--ink-12); letter-spacing: -0.02em; font-size: 22px; }
</style></head>
<body>
  <div class="wrap">
    <div class="stack">
      <div class="label">INTER · 300 / 400 / 600 / 800</div>
      <div class="inter" style="font-weight:800;">Aa Rg 123</div>
      <div class="weights">
        <span style="font-weight:300;">Light</span>
        <span style="font-weight:400;">Regular</span>
        <span style="font-weight:600;">Semibold</span>
        <span style="font-weight:800;">Black</span>
      </div>
      <div class="label">0123456789 · €£¥ · ø ± ≈ →</div>
    </div>
    <div class="stack">
      <div class="label">JETBRAINS MONO · 400 / 500 / 600</div>
      <div class="mono" style="font-weight:500;">Aa 0123</div>
      <div class="mono" style="font-weight:600; font-size: 30px;">1,225 g · €1,299</div>
      <div class="label">tabular-nums · ligatures off</div>
    </div>
  </div>
</body></html>
