<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 28px; display:flex; align-items:center; gap: 48px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .label { font-family: var(--font-mono); font-size: 9px; color: var(--ink-7); }
  .mark { color: var(--ink-12); }
  .wordmark { display: flex; align-items: center; gap: 12px; color: var(--ink-12); }
  .wordmark .name { font-family: var(--font-sans); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
  .wordmark .name b { font-weight: 800; }
  .wordmark .name i { font-style: normal; font-weight: 300; letter-spacing: -0.04em; }
  .stamp { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--ink-10); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-11); }
</style></head>
<body>
  <div class="col">
    <div class="label">MARK</div>
    <img src="../assets/logo-mark.svg" alt="" width="56" height="56" class="mark">
  </div>
  <div class="col">
    <div class="label">WORDMARK · standard</div>
    <div class="wordmark">
      <img src="../assets/logo-mark.svg" alt="" width="28" height="28">
      <div class="name">My<i>Bike</i>Lab</div>
    </div>
    <div class="wordmark">
      <img src="../assets/logo-mark.svg" alt="" width="28" height="28">
      <div class="name">MyBikeLab</div>
    </div>
  </div>
  <div class="col">
    <div class="label">CREDENTIAL STAMP</div>
    <div class="stamp">
      <img src="../assets/logo-mark.svg" alt="" width="14" height="14">
      MyBikeLab · ROAD WHEELS
    </div>
  </div>
</body></html>
