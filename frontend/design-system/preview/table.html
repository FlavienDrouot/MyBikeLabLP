<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 28px; }
  .heading { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 10px 0; }

  table { border-collapse: collapse; width: 100%; font-family: var(--font-sans); font-size: 12px; color: var(--ink-11); background: var(--paper-0); border: 1px solid var(--ink-10); }
  th { text-align: left; font-family: var(--font-sans); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--ink-7); padding: 8px 12px; border-bottom: 1px solid var(--ink-10); background: var(--paper-2); }
  th.num { text-align: right; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--ink-3); }
  td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--ink-10); }
  td .meta { font-family: var(--font-sans); font-size: 10px; color: var(--ink-7); }
  td .price { font-weight: 600; color: var(--ink-12); }
  td .light { color: var(--signal-up); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: var(--brass-1); }
  .idx { font-family: var(--font-mono); color: var(--ink-6); font-size: 10px; }
  .badge { display: inline-block; font-family: var(--font-mono); font-size: 9px; padding: 1px 6px; border: 1px solid var(--ink-4); border-radius: 999px; color: var(--ink-8); letter-spacing: 0.04em; }
</style></head>
<body>
  <div class="heading">Spec table · tabular numerals, hairline rows, hover-tint</div>
  <table>
    <thead>
      <tr>
        <th style="width: 24px;">№</th>
        <th>Model</th>
        <th class="num">Weight</th>
        <th class="num">Depth</th>
        <th>Hookless</th>
        <th class="num">Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="idx">01</td>
        <td><div class="meta">Roval</div>Alpinist CLX II</td>
        <td class="num"><span class="light">1,225 g</span></td>
        <td class="num">33 mm</td>
        <td><span class="badge">Hooked</span></td>
        <td class="num"><span class="price">€1,299</span></td>
      </tr>
      <tr>
        <td class="idx">02</td>
        <td><div class="meta">Zipp</div>303 Firecrest</td>
        <td class="num">1,510 g</td>
        <td class="num">45 mm</td>
        <td><span class="badge" style="border-color:var(--brass-6); color:var(--brass-10);">Hookless</span></td>
        <td class="num"><span class="price">€1,750</span></td>
      </tr>
      <tr>
        <td class="idx">03</td>
        <td><div class="meta">DT Swiss</div>ARC 1100 Dicut 62</td>
        <td class="num">1,510 g</td>
        <td class="num">62 mm</td>
        <td><span class="badge">Hooked</span></td>
        <td class="num"><span class="price">€1,990</span></td>
      </tr>
    </tbody>
  </table>
</body></html>
