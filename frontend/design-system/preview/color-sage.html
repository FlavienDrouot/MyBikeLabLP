<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 18px 24px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 0.7; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; }
  .swatch .name { font-family: var(--font-mono); font-size: 8px; font-weight: 500; }
  .swatch .hex { font-family: var(--font-mono); font-size: 8px; opacity: 0.75; margin-top: 1px; }
  .row-label { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 8px 0; }
</style></head>
<body>
  <div class="row-label">Sage · secondary neutral (12 → 1)</div>
  <div class="grid">
    <div class="swatch" style="background:var(--sage-12); color:#f6f4ef"><div class="name">12</div><div class="hex">#14181a</div></div>
    <div class="swatch" style="background:var(--sage-11); color:#f6f4ef"><div class="name">11</div><div class="hex">#1f2522</div></div>
    <div class="swatch" style="background:var(--sage-10); color:#f6f4ef"><div class="name">10</div><div class="hex">#2d3530</div></div>
    <div class="swatch" style="background:var(--sage-9); color:#f6f4ef"><div class="name">9</div><div class="hex">#3e4742</div></div>
    <div class="swatch" style="background:var(--sage-8); color:#f6f4ef"><div class="name">8</div><div class="hex">#525c54</div></div>
    <div class="swatch" style="background:var(--sage-7); color:#f6f4ef"><div class="name">7</div><div class="hex">#6b7361</div></div>
    <div class="swatch" style="background:var(--sage-6); color:#1a1a17"><div class="name">6</div><div class="hex">#858d7c</div></div>
    <div class="swatch" style="background:var(--sage-5); color:#1a1a17"><div class="name">5</div><div class="hex">#a0a797</div></div>
    <div class="swatch" style="background:var(--sage-4); color:#1a1a17"><div class="name">4</div><div class="hex">#bbc1b4</div></div>
    <div class="swatch" style="background:var(--sage-3); color:#1a1a17"><div class="name">3</div><div class="hex">#d2d6cb</div></div>
    <div class="swatch" style="background:var(--sage-2); color:#1a1a17"><div class="name">2</div><div class="hex">#e2e5dc</div></div>
    <div class="swatch" style="background:var(--sage-1); color:#1a1a17"><div class="name">1</div><div class="hex">#eef0ea</div></div>
  </div>
</body></html>
