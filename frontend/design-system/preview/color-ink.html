<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper-1); }
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { aspect-ratio: 0.7; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; }
  .swatch .name { font-family: var(--font-mono); font-size: 8px; font-weight: 500; }
  .swatch .hex { font-family: var(--font-mono); font-size: 8px; opacity: 0.7; margin-top: 1px; }
  .row-label { font-family: var(--font-sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ink-8); margin: 0 0 8px 0; }
</style></head>
<body>
  <div class="row-label">Ink · neutral scale (12 → 1)</div>
  <div class="grid">
    <div class="swatch" style="background:var(--ink-12); color:#f6f4ef"><div class="name">12</div><div class="hex">#0e0f0c</div></div>
    <div class="swatch" style="background:var(--ink-11); color:#f6f4ef"><div class="name">11</div><div class="hex">#1a1a17</div></div>
    <div class="swatch" style="background:var(--ink-10); color:#f6f4ef"><div class="name">10</div><div class="hex">#2a2a26</div></div>
    <div class="swatch" style="background:var(--ink-9); color:#f6f4ef"><div class="name">9</div><div class="hex">#3a3a35</div></div>
    <div class="swatch" style="background:var(--ink-8); color:#f6f4ef"><div class="name">8</div><div class="hex">#555550</div></div>
    <div class="swatch" style="background:var(--ink-7); color:#f6f4ef"><div class="name">7</div><div class="hex">#6e6d65</div></div>
    <div class="swatch" style="background:var(--ink-6); color:#1a1a17"><div class="name">6</div><div class="hex">#8a8980</div></div>
    <div class="swatch" style="background:var(--ink-5); color:#1a1a17"><div class="name">5</div><div class="hex">#a7a69b</div></div>
    <div class="swatch" style="background:var(--ink-4); color:#1a1a17"><div class="name">4</div><div class="hex">#c2c0b3</div></div>
    <div class="swatch" style="background:var(--ink-3); color:#1a1a17"><div class="name">3</div><div class="hex">#d6d4c7</div></div>
    <div class="swatch" style="background:var(--ink-2); color:#1a1a17"><div class="name">2</div><div class="hex">#e4e2d6</div></div>
    <div class="swatch" style="background:var(--ink-1); color:#1a1a17"><div class="name">1</div><div class="hex">#efede2</div></div>
  </div>
</body></html>
