<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBikeLab — Wheel Comparator</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="comparator.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-screen-label="Comparator · MyBikeLab">
  <div id="root"></div>
  <script>
    /* Inherit the base palette + accent chosen on the landing page. */
    (function () {
      var p = 'paper', a = 'brass';
      try { p = localStorage.getItem('mbl-palette') || 'paper'; a = localStorage.getItem('mbl-accent') || 'brass'; } catch (e) {}
      document.body.classList.add('pal-' + p, 'acc-' + a);
    })();
  </script>

  <script src="wheelsData.js"></script>
  <script type="text/babel" src="FilterPrimitives.jsx"></script>
  <script type="text/babel" src="FilterPanel.jsx"></script>
  <script type="text/babel" src="ColumnPicker.jsx"></script>
  <script type="text/babel" src="WheelTable.jsx"></script>
  <script type="text/babel" src="FilterChips.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
