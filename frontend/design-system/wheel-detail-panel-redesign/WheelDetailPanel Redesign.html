<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WheelDetailPanel — Redesign</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="panel.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--paper-1); }
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#efebe2"/>
    <circle cx="50" cy="42" r="22" fill="none" stroke="#1a1a17" stroke-width="2"/>
    <circle cx="50" cy="42" r="4" fill="#a88846"/>
    <rect x="28" y="74" width="44" height="6" fill="#a88846"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="retained" title="Retenu — fiche prix · Manufacturer / Retailers" subtitle="Tableau de prix de A + séparation fabricant / revendeurs · sans la ligne du haut">
          <DCArtboard id="f" label="Largeur courante (~1040 px)" width={1040}>
            <PanelFinal w={WHEEL} />
          </DCArtboard>
          <DCArtboard id="fw" label="Pleine largeur (~1600 px) — bande centrée" width={1600}>
            <PanelFinal w={WHEEL} />
          </DCArtboard>
        </DCSection>
        <DCSection id="refs" title="Pistes précédentes (référence)" subtitle="A et C — pour mémoire">
          <DCArtboard id="a" label="A · échelle de revendeurs (origine)" width={1040}>
            <PanelA w={WHEEL} />
          </DCArtboard>
          <DCArtboard id="c" label="C · éditorial (séparation reprise)" width={1040}>
            <PanelC w={WHEEL} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
