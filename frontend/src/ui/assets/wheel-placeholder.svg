<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="99" fill="#f8fafc"/>

  <!-- Tire -->
  <circle cx="100" cy="100" r="96" fill="#1e293b"/>

  <!-- Rim body (fills center, creates gray ring between r=67 and r=87) -->
  <circle cx="100" cy="100" r="87" fill="#94a3b8"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#64748b" stroke-width="0.8"/>

  <!-- Interior / spoke bed (creates rim depth band between r=67 and r=87) -->
  <circle cx="100" cy="100" r="67" fill="#f1f5f9"/>
  <circle cx="100" cy="100" r="67" fill="none" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- 18 spokes from hub flange (r=14) to spoke bed (r=67) -->
  <g stroke="#64748b" stroke-width="1.4" stroke-linecap="round">
    <line x1="114.0" y1="100.0" x2="167.0" y2="100.0"/>
    <line x1="113.2" y1="104.8" x2="163.0" y2="122.9"/>
    <line x1="110.7" y1="109.0" x2="151.3" y2="143.1"/>
    <line x1="107.0" y1="112.1" x2="133.5" y2="158.0"/>
    <line x1="102.4" y1="113.8" x2="111.6" y2="166.0"/>
    <line x1="97.6"  y1="113.8" x2="88.4"  y2="166.0"/>
    <line x1="93.0"  y1="112.1" x2="66.5"  y2="158.0"/>
    <line x1="89.3"  y1="109.0" x2="48.7"  y2="143.1"/>
    <line x1="86.8"  y1="104.8" x2="37.0"  y2="122.9"/>
    <line x1="86.0"  y1="100.0" x2="33.0"  y2="100.0"/>
    <line x1="86.8"  y1="95.2"  x2="37.0"  y2="77.1"/>
    <line x1="89.3"  y1="91.0"  x2="48.7"  y2="56.9"/>
    <line x1="93.0"  y1="87.9"  x2="66.5"  y2="42.0"/>
    <line x1="97.6"  y1="86.2"  x2="88.4"  y2="34.0"/>
    <line x1="102.4" y1="86.2"  x2="111.6" y2="34.0"/>
    <line x1="107.0" y1="87.9"  x2="133.5" y2="42.0"/>
    <line x1="110.7" y1="91.0"  x2="151.3" y2="56.9"/>
    <line x1="113.2" y1="95.2"  x2="163.0" y2="77.1"/>
  </g>

  <!-- Hub flange -->
  <circle cx="100" cy="100" r="14" fill="#64748b"/>
  <!-- Hub barrel -->
  <circle cx="100" cy="100" r="8" fill="#334155"/>
  <!-- Axle -->
  <circle cx="100" cy="100" r="3" fill="#0f172a"/>
</svg>
